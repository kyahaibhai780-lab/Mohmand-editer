
name: Build TALHA EDITOR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter App
        run: flutter create talha_editor

      - name: Build APK
        run: |
          cd talha_editor
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TALHA-EDITOR-APK
          path: talha_editor/build/app/outputs/flutter-apk/app-release.apk
